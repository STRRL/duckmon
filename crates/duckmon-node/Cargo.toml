[package]
name = "duckmon-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Node-API addon for duckmon that calls only the duckmon C ABI"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
duckmon-ffi = { path = "../duckmon-ffi" }
napi = { version = "3.16.2", default-features = false, features = ["napi8"] }
napi-derive = "3.7.1"

[build-dependencies]
napi-build = "2.6.0"
