[package]
name = "duckmon-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "C ABI for the duckmon telemetry store"

[lib]
name = "duckmon_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
arrow = { version = "60.1", default-features = false, features = ["ipc"] }
duckmon = { path = "../duckmon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
