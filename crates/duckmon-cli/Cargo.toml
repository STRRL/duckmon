[package]
name = "duckmon-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Command line tool to query, write, follow and compact a duckmon store"

[[bin]]
name = "duckmon"
path = "src/main.rs"
doc = false

[dependencies]
arrow = { version = "60.1", default-features = false, features = ["csv", "json", "prettyprint"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive", "env"] }
duckmon = { path = "../duckmon" }
serde_json = "1"
