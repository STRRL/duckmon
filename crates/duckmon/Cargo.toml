[package]
name = "duckmon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Embedded telemetry store that writes Parquet files and queries them with DuckDB"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
duckdb = { version = "1.20000.1", default-features = false, features = ["bundled", "parquet", "json", "appender-arrow"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
